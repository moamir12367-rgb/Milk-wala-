name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare project
        run: |
          if [ -f settings.gradle ]; then
            echo "Project seedha repo mein hai"
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            ZIP=$(find . -iname "*.zip" -not -path "./extracted/*" | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "Repo mein na project hai na zip. Files ye hain:"
              ls -R | head -60
              exit 1
            fi
            echo "Zip mili: $ZIP"
            unzip -o -q "$ZIP" -d extracted
            FILE=$(find extracted -name settings.gradle | head -n 1)
            if [ -z "$FILE" ]; then
              echo "settings.gradle zip ke andar nahi mili. Andar ye hai:"
              ls -R extracted | head -60
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$FILE")" >> $GITHUB_ENV
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          echo "Project folder: $(pwd)"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MilkmanPRO-apk
          path: '**/app-debug.apk'
          if-no-files-found: error
